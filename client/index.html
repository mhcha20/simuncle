    <style>
      /* =====================================================
         Splash Screen
         米白背景 + 浮動 eSIM/旅遊 SVG 圖示 + Logo 去背 + 載入轉圈
         ===================================================== */
      #html-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #faf8f5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        transition: opacity 0.3s cubic-bezier(0.23,1,0.32,1);
      }



      /* 中心 Logo */
      #sp-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        opacity: 0;
        animation: centerIn 0.6s cubic-bezier(0.23,1,0.32,1) 0.2s forwards;
        z-index: 2;
      }
      @keyframes centerIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Logo：mix-blend-mode multiply 令白色背景融入米白底色 */
      #sp-logo-img {
        width: min(260px, 68vw);
        height: auto;
        mix-blend-mode: multiply;
      }

      /* 載入轉圈 */
      #sp-spinner {
        width: 22px;
        height: 22px;
        border: 2.5px solid rgba(0,0,0,0.1);
        border-top-color: #555;
        border-radius: 50%;
        opacity: 0;
        animation: spinnerIn 0.3s ease 0.5s forwards, spin 0.85s linear 0.5s infinite;
      }
      @keyframes spinnerIn { to { opacity: 1; } }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script>
      (function(){
        var splash = document.getElementById('html-splash');
        if (!splash) return;
        var seen = sessionStorage.getItem('splash_shown');
        if (seen) { splash.style.display = 'none'; return; }
        sessionStorage.setItem('splash_shown', '1');

        var hidden = false;
        function hide() {
          if (hidden) return;
          hidden = true;
          splash.style.opacity = '0';
          setTimeout(function(){ splash.style.display = 'none'; }, 300);
        }
        setTimeout(hide, 300);
        setTimeout(hide, 3000);
        window.__hideSplash = hide;
      })();
    </script>

                  console.log('[PWA] Outdated SW detected, unregistering for fresh start...');
                  reg.unregister().then(function() { window.location.reload(); });
                }

        }).catch(function() {});

        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js')

            .catch(function(err) { console.log('[PWA] Service Worker registration failed:', err); });
        });
      }
